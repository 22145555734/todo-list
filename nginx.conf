server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 满级字体云峰飞云体 7.56MB，实测 gzip 后 4.74MB（压缩率 63%）。
    # 只压传输、不动文件：磁盘上的 .ttf 与上游原文件字节一致（授权不允许修改字体）。
    # woff2 已是压缩格式，列进去也是白费 CPU，故不包含。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        application/javascript
        image/svg+xml
        font/ttf
        font/otf
        application/x-font-ttf
        application/font-woff;

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 构建产物（文件名含内容哈希，内容变则文件名变）：可永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 前端单页应用：入口 HTML 每次回源校验（命中 ETag 返回 304，开销可忽略）
    # 不加 no-cache 时浏览器会套用启发式缓存，导致部署后长期拿到旧版本
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
