server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 满级字体云峰飞云体 7.56MB，gzip 后 4.74MB（压缩率 63%）。
    # 只压传输、不动文件：磁盘上的 .ttf 与上游原文件字节一致（授权不允许修改字体）。
    # woff2 已是压缩格式，列进去也是白费 CPU，故不包含。
    #
    # gzip_types 按响应头里的 Content-Type 匹配，所以字体必须真的被标成 font/ttf：
    # nginx 自带的 mime.types 里**没有 .ttf 条目**，不显式指定的话 .ttf 会落到
    # default_type（application/octet-stream），gzip_types 里的 font/ttf 匹配不上，
    # 压缩会静默失效（首版部署就是这样，7.56MB 原样传输）。见下面 /assets/ 处的规则。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        application/javascript
        image/svg+xml
        font/ttf
        font/otf
        application/x-font-ttf
        application/font-woff;

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 构建产物（文件名含内容哈希，内容变则文件名变）：可永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # .ttf 在 nginx 默认 mime.types 里没有映射，会被当成 application/octet-stream，
    # 导致上面 gzip_types 里的 font/ttf 不生效。这里用 default_type 显式纠正
    # —— 正则 location 优先于前缀 location，故缓存头要在这里重复一次。
    location ~* ^/assets/.*\.ttf$ {
        default_type font/ttf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 前端单页应用：入口 HTML 每次回源校验（命中 ETag 返回 304，开销可忽略）
    # 不加 no-cache 时浏览器会套用启发式缓存，导致部署后长期拿到旧版本
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
