services:
  mysql:
    image: mysql:8.0
    container_name: todo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: todo
      MYSQL_USER: todo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --skip-log-bin
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - todo-net

  backend:
    image: todo-backend:latest
    container_name: todo-backend
    restart: unless-stopped
    build:
      context: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/todo?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      DB_USERNAME: todo
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m
      # 预算到点提醒：往 QQ 机器人的文件队列里写一条消息。chatKey 只写在服务器 .env，
      # 这里是公开仓库，不落具体会话。
      QQ_NOTIFY_INBOX: /var/lib/qq-notify/inbox
      QQ_NOTIFY_CHAT_KEY: ${QQ_NOTIFY_CHAT_KEY:-}
    volumes:
      # 机器人是宿主机进程，只监听回环；容器够不到它，于是共用这个目录投递
      - /var/lib/qq-notify/inbox:/var/lib/qq-notify/inbox
    networks:
      - todo-net

  frontend:
    image: todo-app:latest
    container_name: todo-app
    restart: unless-stopped
    build:
      context: ./frontend
    ports:
      - "8310:80"
    depends_on:
      - backend
    networks:
      - todo-net

networks:
  todo-net:
    driver: bridge

volumes:
  mysql-data:
