server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/todo?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:todo}
    # 不设默认值：本仓库是公开的，写死的兜底密码等于公开凭据
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  plan:
    # 每日计划同步：把 plan_days.json 里「今天」的科目写进 todolist。
    # file / username 任一为空 = 关闭（本地开发不该报错）。计划文件是私人内容，
    # 只以只读卷挂在服务器上，不进仓库。
    file: ${PLAN_FILE:}
    username: ${PLAN_SYNC_USERNAME:}
    # 每天 04:00 换天（东八区）。改这个值可以临时提前跑一次做验证。
    cron: ${PLAN_SYNC_CRON:0 0 4 * * *}
  notify:
    # QQ 机器人的文件投递目录与目标会话。两者任一为空 = 关闭提醒（只停表、不发消息）。
    # 目录不存在时启动不报错，但发送失败会打 warning。
    inbox: ${QQ_NOTIFY_INBOX:}
    chat-key: ${QQ_NOTIFY_CHAT_KEY:}
    # 预算到点扫描间隔
    sweep-ms: ${NOTIFY_SWEEP_MS:10000}
  jwt:
    # 不设默认值：公开仓库里的兜底 JWT 密钥可被用来伪造任意用户的令牌。
    # 缺失时启动即失败（fail-closed），这是刻意的。
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:2592000000}
